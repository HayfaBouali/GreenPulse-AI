name: greenpulse_ai
description: GreenPulse AI — Protection de l'oasis de Gabès par Intelligence Artificielle
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1

  # Camera & Image
  image_picker: ^1.1.2
  camera: ^0.10.5+9

  # Maps
  google_maps_flutter: ^2.6.0
  google_maps_flutter_android: ^2.8.0  # ⚠️ AJOUTÉ pour Android
  google_maps_flutter_ios: ^2.6.0      # ⚠️ AJOUTÉ pour iOS

  # Charts
  fl_chart: ^0.68.0

  # State Management
  provider: ^6.1.2

  # UI & Animations
  lottie: ^3.1.0
  shimmer: ^3.0.0
  animate_do: ^3.3.2

  # Utilities
  permission_handler: ^11.3.1
  geolocator: ^11.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/
    - assets/images/      # ⚠️ AJOUTÉ si vous avez des images
    - assets/animations/  # ⚠️ AJOUTÉ pour Lottie
  
  # Fonts (optionnel)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700